<div class="resumen">
  <div class="anillo">
    <svg viewBox="0 0 44 44" aria-hidden="true">
      <circle class="pista" cx="22" cy="22" r="18" pathLength="100" />
      <circle
        class="avance"
        [class.avance--vacio]="porcentaje() === 0"
        cx="22"
        cy="22"
        r="18"
        pathLength="100"
        [attr.stroke-dasharray]="porcentaje() + ' 100'"
      />
    </svg>
    <span class="cifra">
      <strong>{{ totalCreditos() }}</strong>
      <span>de {{ maximoCreditos }}</span>
    </span>
  </div>

  <div>
    <p class="titulo">Créditos inscritos</p>
    <p class="mensaje" aria-live="polite">{{ mensaje() }}</p>
  </div>
</div>

<ul class="casillas" aria-label="Cupos del semestre">
  @for (casilla of casillas(); track $index) {
    @if (casilla; as materia) {
      <li class="casilla casilla--llena" [attr.data-tono]="paleta().get(materia.profesor) ?? 0">
        <span class="avatar avatar--pequeno" aria-hidden="true">{{ materia.profesor | iniciales }}</span>
        <span class="texto">
          <span class="nombre">{{ materia.nombre }}</span>
          <span class="profesor">{{ materia.profesor }}</span>
        </span>
      </li>
    } @else {
      <li class="casilla casilla--libre">
        <span class="material-symbols-outlined" aria-hidden="true">add</span>
        Cupo libre
      </li>
    }
  }
</ul>
