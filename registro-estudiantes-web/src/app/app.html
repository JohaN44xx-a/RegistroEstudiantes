@if (auth.autenticado()) {
  <header class="barra">
    <a class="marca" [routerLink]="auth.rutaInicio()" aria-label="Ir al inicio">
      <img src="logo.svg" alt="" width="32" height="32" />
      <span>Registro de Estudiantes</span>
    </a>

    <nav class="navegacion" aria-label="Principal">
      @if (auth.esEstudiante()) {
        <a routerLink="/mi-registro" routerLinkActive="activo" ariaCurrentWhenActive="page">
          <span class="material-symbols-outlined" aria-hidden="true">school</span>
          Mi registro
        </a>
      }
      <a routerLink="/registros" routerLinkActive="activo" ariaCurrentWhenActive="page">
        <span class="material-symbols-outlined" aria-hidden="true">groups</span>
        Registros
      </a>
    </nav>

    <div class="usuario">
      <span class="avatar avatar--pequeno" aria-hidden="true">{{ auth.nombre() | iniciales }}</span>
      <span class="nombre">{{ auth.nombre() }}</span>
      <button
        mat-icon-button
        type="button"
        matTooltip="Cerrar sesión"
        aria-label="Cerrar sesión"
        (click)="auth.cerrarSesion()"
      >
        <span class="material-symbols-outlined" aria-hidden="true">logout</span>
      </button>
    </div>
  </header>
}

<main class="contenido" [class.contenido--completo]="!auth.autenticado()">
  <router-outlet />
</main>
